<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="profile-container">

        <div class="profile-card">

            <div class="profile-header-avatar">
                <img id="profile-picture" alt="profile picture" th:src="@{'/uploads/' + ${userInfo.getAvatar()}}" />
            </div>

            <div class="profile-header-user-info">
                <div class="profile-header-overview">
                    <div class="profile-info username" th:text="${userInfo.getUsername()}">Guest</div>
                    <div class="profile-info flag">
                        <img th:src="'https://flagcdn.com/' + ${userInfo.getCountry()}+'.svg'" alt="country-flag" width="30">
                    </div>
                </div>

                <div class="profile-user-description">
                    <div class="profile-description" th:text="${userInfo.description}">No description yet</div>
                    <button class="edit-button" id="edit-description-button">
                        <i class="ti ti-pencil"></i>
                    </button>
                </div>

                <button th:if="${userInfo.getUsername() == currentUser}" class="profile-settings-btn settings-btn">
                    <i class="ti ti-settings"></i>
                </button>
            </div>

        </div>

        <div th:if="${userInfo.getUsername() == currentUser}" class="upload-photo">
            <form method="POST" action="/upload" enctype="multipart/form-data">
                <input required type="file" name="file" accept="image/*" />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">Change profile picture</button>
            </form>
        </div>


        <div id="last-games-container">
            <div id="last-games-header">
                <small th:text="'Games Played (' + ${gameInfo.gamesPlayed}+')'"></small>
            </div>
            <div id="last-games-list">
                <ul th:if="${gameInfo.matchHistoryDTOList != null}">
                    <li th:each="game : ${gameInfo.matchHistoryDTOList}">
                        Opponent: <span th:text="${game.opponent}"></span>,
                        Format: <span th:text="${game.format}"></span>,
                        Moves: <span th:text="${game.numberOfMoves}"></span>

                        <span th:if="${game.outcome}" class="win">WIN</span>
                        <span th:unless="${game.outcome}" class="lose">LOSE</span>
                    </li>
                </ul>
                <div th:unless="${gameInfo.matchHistoryDTOList} != null">User currently has no games</div>
            </div>
        </div>
    </div>
    <script type="module" th:src="@{/js/script.js}"></script>
</body>
</html>
