<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lobbies</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="content-lobby">
        <div class="lobby-header">

            <div class="toolbar-above">
                <div class="page-info">Click on a lobby below to play, or create your own</div>
                <div class="lobby-buttons">
                    <button id="createLobbyButton" class="toolbar-buttons">
                        <i class="ti ti-plus"></i>
                        <label class="button-text">Create lobby</label>
                    </button>
                    <button id="showAvailableLobbiesButton" class="toolbar-buttons">Show Available</button>
                </div>

            </div>
        </div>
        <div id="lobbiesCount"></div>
        <div id="lobbiesContainer"></div>
    </div>
    <div id="lobby-popup-editor" style="display: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script type="module" th:src="@{/ts-transpiled/community/community-index.js}"></script>
</body>
</html>
