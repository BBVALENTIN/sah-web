<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lobbies</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="fragments/navbar :: navbar"></div>
    <div class="content">
        <div class="lobby-header">

            <div class="toolbar-above">
                <div class="page-info">Click on a lobby below to play, or create your own</div>
                <div class="lobby-buttons">
                    <button id="createLobbyButton" class="toolbar-buttons">Create Lobby</button>
                    <button id="showAvailableLobbiesButton" class="toolbar-buttons">Show Available</button>
                </div>

                <div id="lobby-table-body"></div>
            </div>
        </div>
        <div id="lobbiesCount"></div>
    </div>
    <div id="lobby-popup-editor" style="display: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script type="module" th:src="@{/ts-transpiled/lobby/GlobalLobby.js}"></script>
    <script type="module" th:src="@{/js/script.js}"></script>
</body>
</html>
